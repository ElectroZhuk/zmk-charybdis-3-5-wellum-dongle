CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# BLE: минимальная задержка — фиксируем короткий interval и отключаем slave latency
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=4
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=4
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Буферы: увеличиваем для большей пропускной способности (если RAM позволяет)
CONFIG_BT_BUF_ACL_TX_COUNT=48
CONFIG_BT_L2CAP_TX_BUF_COUNT=48

# DLE / PHY / MTU: повышаем пропускную способность и скорость передачи
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_L2CAP_TX_MTU=256

# (опционально) для стабильности при агрессивных настройках
CONFIG_BT_LL_SW_SPLIT=y